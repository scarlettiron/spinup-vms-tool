# Copy this to vm.config.local.yaml and edit it. That file is git-ignored, so
# it's the right place for your password, tokens, and anything you don't want
# shared. Anything you leave out falls back to vm.config.yaml.

username: you
realName: Your Name
password: pick-something

projectName: you

gitName:        Your Name
gitEmail:       you@example.com
githubUsername: yourhandle

# Cloned into ~/src on first boot.
# repos:
#   - git@github.com:acme/web.git
#   - url: https://github.com/acme/api.git
#     branch: develop
#     postClone: npm ci

# Extensions to add on top of the team list. Don't use vscodeExtensions here
# unless you mean to replace that list entirely.
# extraVscodeExtensions:
#   - eamodio.gitlens
#   - charliermarsh.ruff

# cpus:     8
# memoryGB: 16
# diskGB:   40
# timezone: Europe/London

# pythonVersion:  '3.13'
# nodeVersion:    '22'
# installPostman: true
# installDdev:    false
# resolution:     2560x1440

# Adminer needs a password on the postgres account to let you in.
# dbAdminPassword: something-only-you-know
# dbDatabases:     [app_dev]

# Use a hash instead of a plaintext password. Generate one with: .\vm.ps1 hash
# passwordHash: '$6$...'

# A GitHub token, read from your laptop at build time so it never lands in the
# repo. Only needed for private https:// clones, or to register your key for you.
# githubTokenFile: C:\Users\you\.secrets\gh-token

# Commands to run once the VM is provisioned.
# postStart:
#   - cd ~/src/web && npm ci

# A folder from this laptop copied into the guest. It rides in the seed disk,
# so keep it small - config and certs, not data.
# copyFrom: files
# copyTo:   '~'

# Several VMs at once. Each key becomes the VM name and the hostname, and they
# share one switch, so they reach each other at <name>.local.
# machines:
#   web:
#     cpus: 4
#     memoryGB: 8
#   db:
#     cpus: 2
#     memoryGB: 4
#     dbServer: true
