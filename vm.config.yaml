# Scarlett A. Scott
# Created 2026-09-15

# Team defaults. Committed.
# Your own settings go in vm.config.local.yaml, which is git-ignored.

blueprint:      redhat-rocky-workstation
osVersion:      9

projectName:    testvm1

cpus:           6
memoryGB:       4
diskGB:         25

timezone:       America/New_York

repos:          []
reposRoot:      src

# Postgres, plus Adminer on 3800 to browse it.
dbEngine:       postgres
dbVersion:      '17'
dbClient:       true
dbServer:       true
dbAdminer:      true
dbAdminerPort:  3800

vm:
  path:                   C:\VMs
  memoryMinimumGB:        4
  memoryMaximumGB:        16
  dynamicMemory:          true
  switchName:             Default Switch
  secureBoot:             true
  nestedVirtualization:   false
  enhancedSession:        true
  checkpointAfterInstall: true
  automaticCheckpoints:   false

  # Extra disks, mounted at /mnt/<letter>. Attached after the install, so the
  # installer can't pick one as its target.
  dataDisks:
    - label: drive-e
      driveLetter: E
      sizeGB: 50
      filesystem: ext4
    - label: drive-l
      driveLetter: L
      sizeGB: 25
      filesystem: ext4

guest:
  locale:         en_US.UTF-8
  keyboardLayout: us

  primaryUser:
    passwordHash: ''
    authorizedKeys: []

  additionalUsers: []

  ssh:
    installServer:     true
    allowPasswordAuth: true

bootstrap:
  enableMdns:        true
  installDesktop:    true
  displayResolution: 1920x1080
  installDocker:     true
  installDdev:       true
  installNode:       true
  nodeVersion:       lts/*

  # Installed with uv, owned by the user. The system python is left alone,
  # because dnf is written against it.
  pythonVersion:     '3.14'
  nvmVersion:        v0.40.1
  installPython:     true
  installVSCode:     true
  installChrome:     true
  installPostman:    false

  # Setting vscodeExtensions in your local file replaces this list.
  # Use extraVscodeExtensions to add to it instead.
  vscodeExtensions:
    - ms-python.python
    - ms-python.black-formatter
    - frhtylcn.pythonsnippets
    - rangav.vscode-thunder-client
  extraVscodeExtensions: []

  installRemoteAccess: true
  extraAptPackages:  []
  dotfilesRepo:      ''
  rebootWhenDone:    true

database:
  port:          0
  listenAddress: localhost
  adminPassword: ''
  databases:     []

  adminer:
    version: 4.8.1

git:
  defaultBranch: main
  editor:        ''
  pullRebase:    true
  extra:         {}

github:
  sshKey:
    mode:           auto
    type:           ed25519
    comment:        ''
    name:           ''
    privateKeyPath: ''
    publicKeyPath:  ''

  cli:
    install:   true
    token:     ''
    tokenFile: ''
    protocol:  ssh

  uploadSshKey: true
  knownHosts:   true

  # Shred staged secrets in the guest once they're installed.
  shredSecretsAfterUse: true

iso:
  directory:      C:\ISO
  path:           ''
  verifyChecksum: true
