[package]
#The package name is also the command name, the folder name (.vmynt) and the
#prefix of every environment variable. To rename the product, change it here
#and in [package.metadata.brand] below. See docs/releasing.md before you do.
name = "vmynt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reproducible, fully provisioned dev VMs from one YAML file — on Hyper-V, KVM and Apple Virtualization."
license = "MIT"
authors = ["Scarlett A. Scott (codescarlett)"]
repository = "https://github.com/scarlettiron/vmynt"
homepage = "https://scarlettiron.github.io/vmynt/"
documentation = "https://scarlettiron.github.io/vmynt/docs/"
readme = "README.md"
keywords = ["vm", "hyper-v", "kvm", "devtools", "provisioning"]
categories = ["command-line-utilities", "development-tools"]
#Only what the binary needs. The site and packaging stay out of a crates.io
#upload.
include = [
    "/src/**",
    "/assets/**",
    "/blueprints/**",
    "/build.rs",
    "/vm.config.example.yaml",
    "/vm.config.local.example.yaml",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "vmynt"
path = "src/main.rs"

#Everything that names the product outside the Rust code. build.rs, the release
#workflows and packaging/render.py all read these, so nothing else hard-codes them.
[package.metadata.brand]
display-name = "Vmynt"
tagline = "Reproducible dev VMs from a config file"
winget-id = "CodeScarlett.Vmynt"
winget-publisher = "Scarlett A. Scott"
chocolatey-id = "vmynt"
homebrew-tap = "scarlettiron/homebrew-tap"
site-url = "https://scarlettiron.github.io/vmynt/"
apt-url = "https://scarlettiron.github.io/vmynt/apt"

#.deb packages, built with cargo-deb in the release workflow.
[package.metadata.deb]
maintainer = "Scarlett A. Scott (codescarlett) <https://github.com/scarlettiron>"
copyright = "2026, Scarlett A. Scott (codescarlett)"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "openssh-client"
suggests = "libvirt-daemon-system, qemu-system, ovmf, freerdp3-x11 | remmina"
extended-description = """\
Vmynt builds fully provisioned development virtual machines from one YAML file. \
Run vmynt init in a project folder, describe the machine, and get the same desktop \
with git, Node, Python, Docker, ddev, VS Code and a database on every computer."""
assets = [
    ["target/release/vmynt", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/vmynt/README.md", "644"],
    ["LICENSE", "usr/share/doc/vmynt/copyright", "644"],
]

#.rpm packages, built with cargo-generate-rpm in the release workflow.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vmynt", dest = "/usr/bin/vmynt", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/vmynt/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/vmynt/LICENSE", mode = "644" },
]

[dependencies]
anstream = "0.6"
anstyle = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
fatfs = "0.3"
humantime = "2"
include_dir = "0.7"
inquire = "0.9"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha-crypt = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[build-dependencies]
toml = "0.9"

[profile.release]
#Smaller, faster binary for distribution. Panics still print a message.
lto = true
codegen-units = 1
strip = true
